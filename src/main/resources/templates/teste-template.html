<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>{{fileName}}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      max-width: 800px;
      margin: auto;
      background: #fff;
      color: #000;
    }

    h1, h2 {
      text-align: center;
      margin: 0;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 40px;
    }

    .questao {
      margin-bottom: 40px;
      page-break-inside: avoid;
    }

    .meta {
      font-size: 0.9em;
      color: #555;
      margin-bottom: 8px;
    }

    .enunciado {
      font-size: 1.05em;
      margin-bottom: 15px;
    }

    .alternativas p {
      margin: 4px 0;
    }

    .pagebreak {
      page-break-before: always;
    }
  </style>
</head>
<body>

  <h1>{{fileName}}</h1>

  <div class="questao">
    <div class="meta">
      <strong> {{subject}} </strong>
      <strong> {{difficultyLevel}} </strong>
      <strong> {{typeQuestion}} </strong>
    </div>

    <div class="enunciado">
      <strong> {{{questionNumber}}} </strong>
      <div> {{{question}}} </div>
    </div>
  </div>
</body>
</html>
